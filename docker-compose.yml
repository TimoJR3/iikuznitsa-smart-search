services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/raw:/app/data/raw:ro
      - index:/app/data/index
      - runtime:/app/data/runtime
      - hf:/app/data/hf
    expose: ["8000"]
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  index:
  runtime:
  hf:
  caddy_data:
